server {
    listen 80;
    listen 3100;
    server_name www.aiready.p-e.kr;
    return 301 https://www.aiready.p-e.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name www.aiready.p-e.kr;
    ssl_certificate /etc/nginx/ssl/www.aiready.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aiready.p-e.kr/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Browser calls https://api.aiready.p-e.kr/api/v1 on HAProxy directly.
}
