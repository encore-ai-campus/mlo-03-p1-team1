$kind: http-request
method: GET
url: '{{base_url}}/payments/config'
order: 6000
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Payment config is available', () => pm.response.to.have.status(200));
      pm.test('Payment mode is simulation', () => pm.expect(pm.response.json().mode).to.equal('simulation'));
      pm.test('Simulation enabled without refunds or PG identifiers', () => {
        const data = pm.response.json();
        pm.expect(data.enabled).to.equal(true);
        pm.expect(data.refunds_enabled).to.equal(false);
        pm.expect(data.store_id).to.equal('');
        pm.expect(data.channel_key).to.equal('');
      });
